name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      libs: ${{ steps.libs.outputs.libs }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 格式门禁只跑「本次改动涉及的 .fs」，所以需要历史来算改动集合。
          fetch-depth: 0
      # 失败时把原因逐行写成注解：仓库日志接口对普通权限可能不可读，注解在 run 页面与
      # `gh run view` 里都能看到（2026-10-18 首次上线时靠这条定位 CI 专属失败）。
      # 格式门禁的目标集合 = 本次改动相对 PR base（或 push 的上一个提交）的 .fs；
      # **禁止全仓 Fantomas**（895 个 .fs、约 83 秒，且会拖慢每条 CI）。
      - name: 确定格式检查基准
        id: fmtbase
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [ -n "${PR_BASE_SHA:-}" ] && git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
            # PR：取 PR base 与 PR head 的合并基点，避免把 base 分支上别人的提交算进来。
            base="$(git merge-base "${PR_BASE_SHA}" HEAD)"
          elif [ -n "${BEFORE_SHA:-}" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            base="$BEFORE_SHA"
          elif git rev-parse --verify --quiet HEAD~1 >/dev/null 2>&1; then
            base="$(git rev-parse HEAD~1)"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "format check base: ${base:-<none>}"
      - name: 依赖检查
        env:
          WX_FORMAT_BASE: ${{ steps.fmtbase.outputs.base }}
        run: |
          if ! ./x check > check.log 2>&1; then
            tail -30 check.log | sed 's/^/::error::/'
            exit 1
          fi
          tail -1 check.log
      - id: libs
        run: echo "libs=$(ls libs | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  # 断言卫生：恒真断言 / 恒真谓词 / 空转的事实一律红灯。
  # 只读源码，不需要构建产物，所以只 checkout、不 needs pack（秒级，不占矩阵）。
  # 2026-10-21 起随「测试完整性」工作流落地：审计发现过一批「无论行为如何都通过」
  # 的断言，它们让「测试全绿」失去意义；本 job 防止这类写法再次进来。
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 测试失败诊断回归
        run: python3 tools/test_ci_diagnostics.py
      - name: 超时工具进程组回归
        run: python3 tools/test_timeout.py
      - name: 断言卫生
        run: |
          if ! ./x hygiene > hygiene.log 2>&1; then
            tail -40 hygiene.log | sed 's/^/::error::/'
            exit 1
          fi
          tail -1 hygiene.log
      # 界面文案：产品文案规则（术语表、取消类提示须写明 Esc、中文省略号）
      # 没有运行时可观察，所以走独立的 lint 脚本而不是 xunit 用例。
      # 覆盖 libs + compose + app 的生产 .fs（比原先放在 Theme 测试里的范围更宽）。
      - name: 界面文案
        run: |
          if ! ./x lint > lint.log 2>&1; then
            tail -40 lint.log | sed 's/^/::error::/'
            exit 1
          fi
          tail -1 lint.log
      # 空白格式：约束客观的源码文本空白不变量（CRLF/Tab/BOM/代码行尾空白/EOF换行），
      # 避免引入未评审的格式重排与离线边界未定义的外部工具。
      - name: 空白格式
        run: |
          if ! ./x format > format.log 2>&1; then
            tail -40 format.log | sed 's/^/::error::/'
            exit 1
          fi
          tail -1 format.log
  # 一次产包，供组合、仓库外消费与入口构建共用（那些环节只能从交付包构建）。
  pack:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: ./x pack
      - uses: actions/upload-artifact@v7
        with:
          name: feed
          path: artifacts/feed
          if-no-files-found: error
  test:
    # 两个都要：矩阵来自 check 的 libs 输出（needs 只写 pack 会让 fromJson 拿到空串，
    # 2026-10-18 首轮 CI 就是这样在策略求值阶段失败的），feed 来自 pack。
    needs: [check, pack]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lib: ${{ fromJson(needs.check.outputs.libs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      # 库与组合者都只从 pack 产出的本地 feed 取 Wanxiang2.* 交付包（UiKit 已退役；WorkspaceState 例外见根 AGENTS.md）。
      - uses: actions/download-artifact@v8
        with: { name: feed, path: artifacts/feed }
      # 失败时把日志尾部写成注解（与 check 任务同一理由：日志接口对普通权限不可读）。
      - name: 库测试 ${{ matrix.lib }}
        run: |
          if ! ./x test ${{ matrix.lib }} > test.log 2>&1; then
            tail -40 test.log | sed 's/^/::error::/'
            exit 1
          fi
          tail -1 test.log
      - name: 留存库测试失败日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failure-${{ matrix.lib }}
          path: test.log
          retention-days: 14
  compose:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/download-artifact@v8
        with: { name: feed, path: artifacts/feed }
      - name: 组合者测试
        run: |
          if ! ./x compose > compose.log 2>&1; then
            cat compose.log
            grep -E 'failed |FAIL |Expected:|Actual:' compose.log | sed 's/^/::error::/' || true
            exit 1
          fi
          tail -1 compose.log
      - name: 留存组合者失败日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-failure-logs
          path: |
            compose.log
            /tmp/wanxiang2-tests-*/*.log
            /tmp/wanxiang2-tests-*/*.status
          retention-days: 14
  # 仓库外消费（根 SPEC 2）：仓库外的临时项目只从 feed 取包，构建并真实运行。
  consume:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/download-artifact@v8
        with: { name: feed, path: artifacts/feed }
      - name: 仓库外消费
        run: |
          if ! ./x consume > consume.log 2>&1; then
            tail -40 consume.log | sed 's/^/::error::/'
            exit 1
          fi
          tail -2 consume.log
  # 产品入口构建：此前 ci.yml 从不构建 app/Desktop 与 app/Pwa。
  app:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/download-artifact@v8
        with: { name: feed, path: artifacts/feed }
      # PWA 构建需要 wasm-tools workload；安装方式与 release-publish.yml 相同。
      - run: dotnet workload install wasm-tools --skip-manifest-update || dotnet workload install wasm-tools
      # 实测（2026-10-17，本机 SDK 10.0.402 + wasm-tools，NuGet 外部依赖已缓存、Debug）：两入口共 12.7 秒
      #（Desktop 4.4、Pwa 7.6），不算重；CI 另加上面的 workload 安装时间。
      - name: 构建两个入口
        run: |
          if ! ./x app > app.log 2>&1; then
            tail -40 app.log | sed 's/^/::error::/'
            exit 1
          fi
          grep -c "Build succeeded" app.log | sed 's/^/入口构建成功数: /'
  # 桌面启动冒烟：ubuntu runner 没有物理显示器，Avalonia 的原生渲染定时器需要可用的
  # X display（没有时进程直接以 "Avalonia.Native was not able to start the RenderTimer"
  # 退出，与产品缺陷无关）。用 xvfb-run 提供一个虚拟 display 真跑一次进程：
  # 断言退出码 0、startup.firstFrame / startup.listReady 打点、无异常、存储文件与锁收尾。
  # 这条此前只有人工在本机跑，CI 从不覆盖；macOS 的图形会话若起不了渲染定时器就验不了。
  desktop-smoke:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/download-artifact@v8
        with: { name: feed, path: artifacts/feed }
      # Avalonia 在 X11 上要的运行时库（libSkiaSharp 依赖的字体/图形栈）与 xvfb 一起装。
      - name: 安装 X11 与虚拟显示器
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libx11-6 libice6 libsm6 libfontconfig1 libfreetype6 \
            libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 libegl1
      - name: 桌面冒烟（xvfb）
        run: |
          if ! xvfb-run -a --server-args="-screen 0 1280x800x24" \
              bash tools/smoke_desktop.sh > smoke.log 2>&1; then
            grep -E '^  (ok|FAIL)|^结果' smoke.log | tail -20 | sed 's/^/::error::/'
            tail -30 smoke.log | sed 's/^/::error::/'
            exit 1
          fi
          grep -E '^结果' smoke.log
  # 发布产物冒烟：自包含 publish（含 PWA 包与 avalonia.js 补丁）+ headless Chrome 真跑一遍
  #（画布渲染、DPR 2 补丁、文本上屏桥）。这是用户实际拿到的那份产物的验证，与 Debug 构建互补。
  # 画廊深浅双主题像素基线（G3 门禁）：消费 pack 产出的本地 feed 并在独立 CI 作业中核查。
  # 放在 pack 之后独立消费 feed，避免在源码秒级 check 里反复构建。
  gallery-baseline:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/download-artifact@v8
        with: { name: feed, path: artifacts/feed }
      - name: 画廊深浅双主题像素基线核查
        run: |
          if ! bash tools/gallery-baseline.sh compose/Gallery/baselines > baseline.log 2>&1; then
            tail -40 baseline.log | sed 's/^/::error::/'
            exit 1
          fi
          tail -1 baseline.log
  published-smoke:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/download-artifact@v8
        with: { name: feed, path: artifacts/feed }
      - run: dotnet workload install wasm-tools --skip-manifest-update || dotnet workload install wasm-tools
      - run: npm ci
      - name: 安装中文截图识别依赖
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
      - run: WX_SKIP_PACK=1 bash publish.sh linux-x64 v0.0.0-ci
      - name: 发布产物冒烟
        run: |
          if ! bash tools/smoke_published.sh artifacts/publish/linux-x64 > smoke.log 2>&1; then
            grep -E '^(PASS|FAIL)' smoke.log | tail -20 | sed 's/^/::error::/'
            tail -20 smoke.log | sed 's/^/::error::/'
            exit 1
          fi
          grep -c '^PASS' smoke.log | sed 's/^/冒烟通过项: /'
      - name: 留存发布冒烟失败现场
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: published-smoke-failure
          path: |
            smoke.log
            artifacts/smoke-published/
          retention-days: 14
  widget-template:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: ./x new-widget CiSmoke
      - run: "! ./x new-widget CiSmoke"
      # UNWIRED 只豁免生产消费者；未接画廊的控件仍须被覆盖门禁拒绝。
      - name: 生成后检查精确拒绝缺失画廊条目
        run: |
          if ./x check > check.log 2>&1; then
            echo '::error::未接画廊的控件不应通过 check'
            exit 1
          fi
          failures="$(grep '^FAIL ' check.log || true)"
          if [ "$failures" != 'FAIL CiSmoke: control library has no gallery entry' ]; then
            tail -30 check.log | sed 's/^/::error::/'
            exit 1
          fi
          cat check.log
      - name: 生成后测试
        run: |
          if ! ./x test CiSmoke > test.log 2>&1; then
            tail -30 test.log | sed 's/^/::error::/'
            exit 1
          fi
      - name: check rejects a lib-to-lib reference
        run: |
          sed -i 's#<PackageReference Include="Avalonia" />#<PackageReference Include="Avalonia" /><ProjectReference Include="../AppConfig/AppConfig.fsproj" />#' libs/CiSmoke/CiSmoke.fsproj
          if ./x check > reference-check.log 2>&1; then
            echo '::error::兄弟库源码引用不应通过 check'
            exit 1
          fi
          grep -Fx 'FAIL CiSmoke: main project must have no ProjectReference' reference-check.log
